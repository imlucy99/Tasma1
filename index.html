<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JGVRP Speedometer HUD</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="hud" id="hud">
    <svg id="dial" viewBox="0 0 800 370" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2a2a"/><stop offset="1" stop-color="#090909"/></linearGradient>
        <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a9a9a"/><stop offset="1" stop-color="#2c2c2c"/></linearGradient>
        <radialGradient id="cream" cx="50%" cy="100%" r="90%"><stop offset="0" stop-color="#f3ead2"/><stop offset="1" stop-color="#cdbf9f"/></radialGradient>
        <pattern id="vr" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="1.6" height="4" fill="rgba(0,0,0,.6)"/></pattern>
        <pattern id="hr" width="4" height="5" patternUnits="userSpaceOnUse"><rect width="4" height="1.6" fill="rgba(255,255,255,.08)"/><rect y="2.6" width="4" height="1.6" fill="rgba(0,0,0,.6)"/></pattern>
      </defs>

      <!-- BODI, VISOR, JENDELA DIAL, WAJAH KREM -->
      <g id="back">
        <path id="body" d="M30 245C30 160 60 95 112 66Q400 8 688 66C740 95 770 160 770 245V320Q770 355 740 358H60Q30 355 30 320Z" fill="url(#hg)" stroke="url(#edge)" stroke-width="2.5"/>
        <path d="M30 245C30 160 60 95 112 66Q400 8 688 66C740 95 770 160 770 245V320Q770 355 740 358H60Q30 355 30 320Z" fill="url(#vr)"/>
        <path d="M62 238Q52 200 60 168C70 120 110 100 200 96L600 96C690 100 730 120 740 168Q748 200 738 238Z" fill="#050505" stroke="#2c2c2c" stroke-width="3"/>
        <path d="M124 237L160 165Q400 123 640 165L676 237Z" fill="url(#cream)"/>
        <path d="M169 237Q175 205 200 199Q400 176 600 199Q625 205 631 237" fill="none" stroke="rgba(0,0,0,.14)" stroke-width="1.5"/>
      </g>
      <g id="art"></g>
      <g id="needleLayer"></g>

      <!-- PANEL RIBBED BAWAH (menutup pangkal jarum) -->
      <g id="panel">
        <path d="M36 240H764V318Q764 350 730 350H70Q36 350 36 318Z" fill="#131313"/>
        <path d="M36 240H764V318Q764 350 730 350H70Q36 350 36 318Z" fill="url(#hr)" stroke="rgba(255,255,255,.12)"/>
      </g>
      <g id="gauges"></g>
    </svg>
  </div>
  <script src="script.js"></script>
</body>
</html>
